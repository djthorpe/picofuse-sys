name: Build Matrix

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  discover-pico-boards:
    name: Discover Pico Boards
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.discover.outputs.boards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Discover boards from include/boards
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          local_boards=$(find include/boards -maxdepth 1 -type f -name '*.h' -print \
            | sort \
            | sed -E 's|.*/||; s|\.h$||')

          explicit_boards=$(printf '%s\n' \
            pico \
            pico_w \
            pico2 \
            pico2_w \
            pimoroni_pico_plus2_rp2350 \
            pimoroni_pico_plus2_w_rp2350 \
            pimoroni_picolipo_16mb \
            pimoroni_picolipo_4mb \
            pimoroni_tiny2040 \
            pimoroni_tiny2040_2mb \
            pimoroni_tiny2350)

          boards_json=$(printf '%s\n%s\n' "$local_boards" "$explicit_boards" \
            | sed '/^$/d' \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Detected boards: ${boards_json}"
          echo "boards=${boards_json}" >> "$GITHUB_OUTPUT"

  build-linux-amd64:
    name: Linux amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make libssl-dev

      - name: Resolve version
        id: version
        run: |
          echo "value=$(make version)" >> "$GITHUB_OUTPUT"

      - name: Build and install (Release)
        run: |
          make install \
            BUILD_DIR=build-linux-Release \
            CMAKE_BUILD_TYPE=Release \
            PICOFUSE_USB=OFF \
            PREFIX=out

      - name: Build and install (Debug)
        run: |
          make install \
            BUILD_DIR=build-linux-Debug \
            CMAKE_BUILD_TYPE=Debug \
            PICOFUSE_USB=OFF \
            PREFIX=out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: picofuse-linux-amd64-${{ steps.version.outputs.value }}
          path: out

  build-linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make libssl-dev

      - name: Resolve version
        id: version
        run: |
          echo "value=$(make version)" >> "$GITHUB_OUTPUT"

      - name: Build and install (Release)
        run: |
          make install \
            BUILD_DIR=build-linux-Release \
            CMAKE_BUILD_TYPE=Release \
            PICOFUSE_USB=OFF \
            PREFIX=out

      - name: Build and install (Debug)
        run: |
          make install \
            BUILD_DIR=build-linux-Debug \
            CMAKE_BUILD_TYPE=Debug \
            PICOFUSE_USB=OFF \
            PREFIX=out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: picofuse-linux-arm64-${{ steps.version.outputs.value }}
          path: out

  build-darwin-arm64:
    name: Darwin arm64
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Darwin dependencies
        run: |
          brew install openssl@3

      - name: Resolve version
        id: version
        run: |
          echo "value=$(make version)" >> "$GITHUB_OUTPUT"

      - name: Build and install (Release)
        run: |
          make install \
            BUILD_DIR=build-darwin-Release \
            CMAKE_BUILD_TYPE=Release \
            PICOFUSE_USB=OFF \
            PREFIX=out

      - name: Build and install (Debug)
        run: |
          make install \
            BUILD_DIR=build-darwin-Debug \
            CMAKE_BUILD_TYPE=Debug \
            PICOFUSE_USB=OFF \
            PREFIX=out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: picofuse-darwin-arm64-${{ steps.version.outputs.value }}
          path: out

  build-pico:
    name: Pico ${{ matrix.board }}
    runs-on: ubuntu-latest
    needs: discover-pico-boards
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.discover-pico-boards.outputs.boards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Pico toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make gcc-arm-none-eabi

      - name: Resolve version
        id: version
        run: |
          echo "value=$(make version)" >> "$GITHUB_OUTPUT"

      - name: Build and install (Release)
        run: |
          make install \
            BUILD_DIR=build-pico-${{ matrix.board }}-Release \
            CMAKE_BUILD_TYPE=Release \
            PICO_BOARD=${{ matrix.board }} \
            PICOFUSE_USB=OFF \
            PREFIX=out

      - name: Build and install (Debug)
        run: |
          make install \
            BUILD_DIR=build-pico-${{ matrix.board }}-Debug \
            CMAKE_BUILD_TYPE=Debug \
            PICO_BOARD=${{ matrix.board }} \
            PICOFUSE_USB=OFF \
            PREFIX=out

      - name: Upload partial artifact
        uses: actions/upload-artifact@v7
        with:
          name: pico-partial-${{ matrix.board }}-${{ steps.version.outputs.value }}
          path: out

  package-pico:
    name: Package Pico
    runs-on: ubuntu-latest
    needs: build-pico
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          echo "value=$(make version)" >> "$GITHUB_OUTPUT"

      - name: Download all board artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pico-partial-*
          merge-multiple: true
          path: out

      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: picofuse-pico-${{ steps.version.outputs.value }}
          path: out

  publish-release-assets:
    name: Publish Release Assets
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs:
      - build-linux-amd64
      - build-linux-arm64
      - build-darwin-arm64
      - package-pico
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: picofuse-*
          path: artifacts

      - name: Archive artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          for dir in artifacts/*; do
            if [ -d "$dir" ]; then
              name="$(basename "$dir")"
              tar -C artifacts -czf "release-assets/${name}.tar.gz" "$name"
            fi
          done

          ls -la release-assets

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.tar.gz
